# Dart package identifiers must be lowercase; the product name is DearMe.
name: dearme
description: "DearMe - letters to your future self."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  fluent_icons_kit: ^0.1.2
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.3

  # Cross-platform local database (file-based on native, IndexedDB on web).
  sembast: ^3.10.1
  sembast_web: ^2.4.7
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.6

  # Notifications: Android, iOS, macOS, Linux, Windows and immediate web
  # notifications. Web Push delivery is implemented by the bundled backend.
  flutter_local_notifications: ^23.0.1
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
  web: ^1.1.2
  http: ^1.6.0

  file_picker: ^13.3.3
  package_info_plus: ^10.2.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Tiny5Duo
      fonts:
        - asset: assets/fonts/Tiny5Duo/Tiny5Duo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tiny5Duo/Tiny5Duo-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Tiny5Duo/Tiny5Duo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tiny5Duo/Tiny5Duo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Tiny5Duo/Tiny5Duo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tiny5Duo/Tiny5Duo-BoldItalic.ttf
          weight: 700
          style: italic
